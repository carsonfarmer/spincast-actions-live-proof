name: test inputs
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Phase
        required: true
        default: build-only
        type: choice
        options: [build-only, claim-link]
jobs:
  test:
    environment: spincast-production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - run: echo "phase=${{ inputs.phase }}"
