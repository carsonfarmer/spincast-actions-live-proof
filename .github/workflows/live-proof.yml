name: task-7.3 live hosted proof

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Phase
        required: true
        default: build-only
        type: choice
        options: [build-only, claim-link, inspect, delete]

jobs:
  deploy:
    environment: spincast-production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SPINCAST_CONTROLLER: ${{ vars.SPINCAST_CONTROLLER }}
      SPINCAST_AUTH_ORIGIN: ${{ vars.SPINCAST_AUTH_ORIGIN }}
    steps:
      - name: Check out application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install Spin
        run: |
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -LfsS \
            https://github.com/spinframework/spin/releases/download/v4.0.2/spin-v4.0.2-linux-amd64.tar.gz \
            -o /tmp/spin.tar.gz
          printf '79523cfc93424d555b3493c7ea07e0fb482e1fd9972f29a83bea0ba7d764bf00  /tmp/spin.tar.gz\n' |
            sha256sum --check --strict
          sudo tar xzf /tmp/spin.tar.gz -C /usr/local/bin spin
          spin --version

      - name: Install Cast from public release
        run: |
          manifest="$RUNNER_TEMP/cast-plugin.json"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -LfsS \
            https://github.com/carsonfarmer/spincast-plugin/releases/download/v0.2.9/cast-plugin.json \
            -o "$manifest"
          printf '92a0d2a3b3e3f141a830733ced5d259427f088b9e3303d4b80014a89e6e09909  %s\n' "$manifest" |
            sha256sum --check --strict
          spin plugins install --yes --file "$manifest"
          spin cast --help >/dev/null

      - name: Build complete (build-only phase)
        if: inputs.phase == 'build-only'
        run: echo "Spin and Cast installed successfully"

      - name: Capture claim and link
        if: inputs.phase == 'claim-link'
        run: |
          set -euo pipefail
          spin cast auth actions link

      - name: Inspect workload apps
        if: inputs.phase == 'inspect'
        run: |
          spin cast status
          spin cast inspect

      - name: Delete workload app
        if: inputs.phase == 'delete'
        run: |
          app_id="${SPINCAST_APP_LABEL:-}"
          generation="$(spin cast status | python3 -c 'import json,sys; print(json.load(sys.stdin)["generation"])')"
          spin cast delete --id "delete-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --expected-generation "$generation" --app-id "$app_id"

      - name: Scan for credential residue
        if: always()
        run: |
          python3 -c "
          import os, re, pathlib
          patterns = (
              re.compile(rb'eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}'),
              re.compile(rb'gh[pousr]_[A-Za-z0-9]{20,}'),
              re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          )
          for root, dirs, files in os.walk(os.environ.get('RUNNER_TEMP', '/tmp')):
              for name in files:
                  path = os.path.join(root, name)
                  try: data = pathlib.Path(path).read_bytes()
                  except Exception: continue
                  for pattern in patterns:
                      if pattern.search(data):
                          raise SystemExit(f'forbidden credential-shaped residue in {path}')
          print('no credential residue found')
          "
